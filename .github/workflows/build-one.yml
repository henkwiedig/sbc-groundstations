name: build-one
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (a configs/<platform>_defconfig, e.g. caddx_vrxpro)'
        required: true
      commit:
        description: 'Commit SHA to build (optional; defaults to current branch HEAD). Use this from `git bisect run` or for one-off historic rebuilds.'
        required: false

jobs:
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      ref:       ${{ steps.r.outputs.ref }}
      short_sha: ${{ steps.r.outputs.short_sha }}
      tag_name:  ${{ steps.r.outputs.tag_name }}
    steps:
      - id: r
        run: |
          REF="${{ inputs.commit }}"
          [ -z "$REF" ] && REF="${{ github.sha }}"
          SHORT="$(printf '%s' "$REF" | cut -c1-7)"
          # Never starting with "2": master.yml builds and releases tags
          # matching '2*' as CalVer versions.
          if [ -n "${{ inputs.commit }}" ]; then
            TAG="build-one-${SHORT}"
          else
            TAG="build-one-${SHORT}-$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "ref=$REF"               >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT"       >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG"          >> "$GITHUB_OUTPUT"
          echo "Building ${{ inputs.platform }} at $REF -> release tag $TAG"

  buildroot:
    name: Build Firmware (${{ inputs.platform }})
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - name: Display free disk space
        run: df -hT

      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Prepare firmware
        run: |
          echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
          echo "CACHE_DATE=$(date +%m)" >> $GITHUB_ENV
          sudo apt update
          sudo apt install -y cpio rsync bc qemu-user-static binfmt-support
          sudo mkdir -p /mnt/workspace
          sudo chown $USER:$USER /mnt/workspace
          rsync -a "$GITHUB_WORKSPACE/" /mnt/workspace/

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /tmp/ccache
          key: ${{ inputs.platform }}-ccache-${{ env.CACHE_DATE }}
          restore-keys: |
            ${{ inputs.platform }}-ccache-

      - name: Build firmware
        working-directory: /mnt/workspace
        run: |
          mkdir -p /tmp/ccache
          export BR2_CCACHE_DIR=/tmp/ccache

          NAME=${{ inputs.platform }}
          # caddx_vrxpro: ascent-vendor-firmware extracts the AR8030 baseband
          # firmware from CADDX's stock image with ubireader_extract_files, a
          # host prerequisite.
          if [ "${NAME}" = caddx_vrxpro ]; then
            pipx install ubi_reader
          fi
          # betafpv_vr04: artlynk-vr04-vendor-firmware takes BetaFPV's and
          # CADDX's stock images apart with ubi_reader and python3's lzo module
          # (the host's python3, not Buildroot's), and post-image packs the
          # update image with lzo.
          if [ "${NAME}" = betafpv_vr04 ]; then
            pipx install ubi_reader
            sudo apt install -y python3-lzo
          fi

          DEFCONFIG=${NAME}_defconfig bash build.sh

          # The VR04's update image under a fixed name, so a release replaces
          # it instead of collecting one per commit; the SD-card update and the
          # stock update menu take any P1_GND_*.img.
          for f in output/${NAME}_defconfig/images/P1_GND_*_OpenIPC_*.img; do
            if [ -f "$f" ]; then
              mv "$f" "${f%_OpenIPC_*}_OpenIPC.img"
            fi
          done

      - name: Upload firmware
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag_name }}
          prerelease: true
          body: |
            sha=${{ needs.resolve.outputs.ref }}
            short=${{ needs.resolve.outputs.short_sha }}
            platform=${{ inputs.platform }}
            one_off=true
          files: |
            /mnt/workspace/output/${{ inputs.platform }}_defconfig/images/${{ inputs.platform }}_sdcard.img
            /mnt/workspace/output/${{ inputs.platform }}_defconfig/images/${{ inputs.platform }}_boot.scr
            /mnt/workspace/output/${{ inputs.platform }}_defconfig/images/${{ inputs.platform }}_u-boot.bin
            /mnt/workspace/output/${{ inputs.platform }}_defconfig/images/${{ inputs.platform }}_emmc_bootloader.img
            /mnt/workspace/output/${{ inputs.platform }}_defconfig/images/${{ inputs.platform }}_rootfs.squashfs
            /mnt/workspace/output/${{ inputs.platform }}_defconfig/images/${{ inputs.platform }}.tar.gz
            /mnt/workspace/output/${{ inputs.platform }}_defconfig/images/${{ inputs.platform }}_testboot.tar
            /mnt/workspace/output/${{ inputs.platform }}_defconfig/images/P1_GND_*_OpenIPC.img
