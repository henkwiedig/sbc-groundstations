gsmenu:
  enabled: true
  # Buttons are provided by the kernel via DT overlay
  # rk3566-gsmenu-keys-runcam-overlay; PixelPilot reads them through evdev.
  input:
    backend: evdev

  actions:
    ground:
      - label: Toggle gadget mode
        action: /usr/sbin/gadget
      - label: Generate support package
        action: /usr/bin/collect_support_data.sh