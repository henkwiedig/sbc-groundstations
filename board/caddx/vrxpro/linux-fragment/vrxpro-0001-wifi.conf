# Onboard companion/config wifi: Realtek RTL8188FTV, USB (0bda:f179), gated
# by a plain GPIO (gpio105) the vendor firmware drives directly via sysfs
# (see board/caddx/vrxpro/overlay init script). Not the wfb-ng video-link
# chip -- vendor uses it purely as a local hostapd AP for their phone app.
CONFIG_RTL8XXXU=m
