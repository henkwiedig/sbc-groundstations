# The SD host's I/O rail and the panel straps are artosyn_gpio hogs.
softdep dw_mci_artosyn pre: artosyn_gpio
# AR8030 (SDIO): no link stack yet, leave the chip unbound.
blacklist artosyn_sdio
# Display (artosyn_vo, artosyn_dsi and the panel or bridge: panel-qy45043a0 on
# the VR04, lontium-lt9611ex on the P1 HD VRX) loads by DT compatible. The
# VR04's panel driver sends the QY45043A0 init without reading the panel's ID,
# as stock's detection does first on every boot; it also brings up the
# nd043fhdm30p panel other VR04 units have (bench unit, 2026-10-23). Keep it
# out for a boot with
# modprobe.blacklist=artosyn_vo,artosyn_dsi,panel_qy45043a0,lontium_lt9611ex.
