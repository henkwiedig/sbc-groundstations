# userapp0/userapp1 (45 MiB = 360 PEBs of 128 KiB) for betafpv_vr04, ubinized
# by post-image.sh. The rootfs as squashfs, which the dtb's bootargs mount
# through a UBI block device (ubi.block=0,rootfs root=/dev/ubiblock0_0, like
# stock's slots), and rootfs_data, the overlay /init mounts as
# UBIFS -- created empty, so the first mount formats it, and autoresized on
# the first attach to everything rootfs leaves, after UBI's 4 own PEBs and the
# 20 it holds back for bad blocks (CONFIG_MTD_UBI_BEB_LIMIT, counted per 1024
# PEBs of the whole chip).
[rootfs]
mode=ubi
vol_id=0
vol_type=dynamic
vol_name=rootfs
vol_alignment=1
vol_size=34MiB
image=rootfs.squashfs

[rootfs_data]
mode=ubi
vol_id=1
vol_type=dynamic
vol_name=rootfs_data
vol_alignment=1
vol_size=2MiB
vol_flags=autoresize
