gsmenu:
  enabled: true
  # BetaFPV VR04: all eight buttons are one resistor ladder on the AR9311's
  # ADC, channel 0 (the kernel's adc-keys reads the same channel), so they
  # go through the VRX Pro's ladder reader (vrx_adc) with this table:
  # millivolts measured on the bench unit, 2026-10-24, each ~20 mV under the
  # device tree's adc-keys thresholds; released, the channel reads 0. Back
  # acts as left (a step back); bind opens the bind dialog (/usr/bin/bind).
  vrx_adc:
    enabled: true
    device: /sys/bus/iio/devices/iio:device0/in_voltage0_raw
    scale_mv: auto
    bind_device: ""
    keys:
      - { name: bind,   mv: 219 }
      - { name: back,   mv: 380 }
      - { name: record, mv: 582 }
      - { name: up,     mv: 780 }
      - { name: left,   mv: 978 }
      - { name: right,  mv: 1180 }
      - { name: enter,  mv: 1376 }
      - { name: down,   mv: 1570 }
# enables collection of `os_mon.*` OSD facts, the same ones the VRX Pro's OSD
# shows (board/common/artosyn-osd):
os_sensors:
  # The battery: ADC channel 1 (calibrated mV) behind a 20.7:1 divider, as
  # os_mon.power.voltage{sensor=vrx} like the VRX Pro's supply voltage.
  power:
    - type: iio
      path: /sys/bus/iio/devices/iio:device0/in_voltage1_input
      multiplier: 20.7
      name: vrx
  # The SoC temperature (artosyn_protemp: whole degrees C in in_temp_scale),
  # os_mon.temperature{name=soc}.
  temperature:
    - type: iio
      path: /sys/bus/iio/devices/iio:device1/in_temp_scale
      multiplier: 1000
      name: soc
