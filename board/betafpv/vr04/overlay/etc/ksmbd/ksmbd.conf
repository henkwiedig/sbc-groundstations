; The DVR share, as the other targets' /etc/samba/smb.conf: the recordings on
; the SD card (autofs, /media/dvr) for anyone, read and write. Served by the
; kernel's ksmbd (S91smb), see ksmbd.conf(5).
[global]
	workgroup = WORKGROUP
	map to guest = bad user

[dvr]
	comment = OpenIPC GS DVR
	path = /media/dvr
	guest ok = yes
	writeable = yes
	force user = root
	create mask = 0666
	directory mask = 0777
