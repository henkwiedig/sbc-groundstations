# autofs configuration, the VR04's over the common one
#
# browse_mode=no: the mount point of an expired key goes away with its
# mount. ksmbd looks the DVR share's path (/media/dvr) up the way a stat does,
# which mounts a missing directory but not an existing one: in autofs'
# default browse mode it served the empty mount point once the SD card had
# expired (Samba chdir()s into the share, which mounts it).

[autofs]
negative_timeout=5
browse_mode=no
