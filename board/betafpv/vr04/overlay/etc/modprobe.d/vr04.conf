# The SD host's I/O rail and the panel straps are artosyn_gpio hogs.
softdep dw_mci_artosyn pre: artosyn_gpio
# AR8030 (SDIO): no link stack yet, leave the chip unbound.
blacklist artosyn_sdio
# Display: ml-kernel only drives the QY45043A0 panel and sends its init table
# without reading the panel's ID first; VR04 units also ship with the
# nd043fhdm30p. Kept out until the panel is detected: `modprobe artosyn_vo
# artosyn_dsi panel-qy45043a0` on a unit known to have the QY45043A0.
blacklist artosyn_vo
blacklist artosyn_dsi
blacklist panel_qy45043a0
